<!DOCTYPE html>
<html lang="es" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis mensajes · Golden Message</title>
    <script>(function(){var t="dark";try{t=localStorage.getItem("theme")||"dark"}catch(e){}document.documentElement.setAttribute("data-theme",t);document.documentElement.setAttribute("data-bs-theme",t);})();</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/core/tokens.css">
    <link rel="stylesheet" href="/styles/core/bootstrap-theme.css">
    <link rel="stylesheet" href="/styles/core/base.css">
    <link rel="stylesheet" href="/styles/core/components.css">
    <link rel="stylesheet" href="/styles/core/shell.css">
    <link rel="stylesheet" href="/styles/admin/gestionmensajes.css">
    <script src="/js/theme.js" defer></script>
    <script src="/js/core/shell.js" defer></script>
    <script src="/js/admin/index.js" defer></script>
</head>

<body>
    <div class="gm-app" id="gm-app">
        <main class="gm-main">
            <div class="gm-page">

                <header class="gm-page-header">
                    <div>
                        <span class="gm-eyebrow">Panel de mensajes</span>
                        <h1>Mis mensajes</h1>
                        <p>Administra, edita y comparte los mensajes que has creado.</p>
                    </div>
                    <div class="gm-page-actions">
                        <button class="btn btn-primary" id="btn-agregar">
                            <i class="fa-solid fa-plus"></i> Nuevo mensaje
                        </button>
                    </div>
                </header>

                <section class="gm-stats" aria-label="Resumen de mensajes">
                    <div class="gm-stat-card">
                        <span class="gm-stat-icon"><i class="fa-solid fa-layer-group"></i></span>
                        <div>
                            <strong id="stat-total">0</strong>
                            <small>Mensajes totales</small>
                        </div>
                    </div>
                    <div class="gm-stat-card">
                        <span class="gm-stat-icon gm-stat-icon-active"><i class="fa-solid fa-circle-check"></i></span>
                        <div>
                            <strong id="stat-activos">0</strong>
                            <small>Activos</small>
                        </div>
                    </div>
                    <div class="gm-stat-card">
                        <span class="gm-stat-icon gm-stat-icon-shared"><i class="fa-solid fa-share-nodes"></i></span>
                        <div>
                            <strong id="stat-compartidos">0</strong>
                            <small>Compartidos</small>
                        </div>
                    </div>
                </section>

                <section class="gm-card gm-table-card">

                    <div class="gm-toolbar">
                        <div class="gm-search">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="table-search" placeholder="Buscar por título del mensaje…" aria-label="Buscar mensajes">
                        </div>

                        <div class="gm-toolbar-actions">
                            <button class="btn btn-outline-secondary" id="btn-buscar">Buscar</button>
                            <button class="btn btn-outline-secondary" type="button" data-bs-toggle="collapse"
                                data-bs-target="#gm-filtros" aria-expanded="false" aria-controls="gm-filtros">
                                <i class="fa-solid fa-sliders"></i> Filtros
                            </button>
                            <button class="btn btn-outline-secondary" id="btn-limpiar" title="Limpiar filtros">
                                <i class="fa-solid fa-eraser"></i><span class="d-none d-sm-inline">Limpiar</span>
                            </button>
                            <button class="btn btn-outline-secondary" id="btn-exportar" title="Exportar">
                                <i class="fa-solid fa-arrow-up-from-bracket"></i><span class="d-none d-sm-inline">Exportar</span>
                            </button>
                        </div>
                    </div>

                    <div class="collapse" id="gm-filtros">
                        <div class="gm-filters">
                            <div class="gm-filter-group">
                                <label class="form-label" for="filter-estado">Estado</label>
                                <select id="filter-estado" class="form-select form-select-sm">
                                    <option value="">Todos</option>
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                    <option value="compartido">Compartido</option>
                                    <option value="privado">Privado</option>
                                </select>
                            </div>
                            <div class="gm-filter-group">
                                <label class="form-label" for="filter-start-date">Desde</label>
                                <input type="date" id="filter-start-date" class="form-control form-control-sm">
                            </div>
                            <div class="gm-filter-group">
                                <label class="form-label" for="filter-end-date">Hasta</label>
                                <input type="date" id="filter-end-date" class="form-control form-control-sm">
                            </div>
                            <div class="gm-filter-group">
                                <label class="form-label" for="filter-usuario">Usuario</label>
                                <input type="text" id="filter-usuario" class="form-control form-control-sm" placeholder="Filtrar por usuario">
                            </div>
                            <div class="gm-filter-group gm-filter-apply">
                                <button class="btn btn-primary btn-sm" id="btn-aplicar-filtros">
                                    <i class="fa-solid fa-check"></i> Aplicar
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla (se transforma en tarjetas en móvil vía CSS) -->
                    <div class="table-responsive gm-table-wrap">
                        <table class="table table-hover align-middle gm-table" id="tabla-mensajes">
                            <thead>
                                <tr>
                                    <th class="gm-col-edit"><span class="visually-hidden">Editar</span></th>
                                    <th>Título</th>
                                    <th>Compartido</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-messages">
                                <!-- Filas inyectadas por JS -->
                            </tbody>
                        </table>

                        <div class="gm-empty d-none" id="gm-empty">
                            <i class="fa-regular fa-envelope-open"></i>
                            <h3>Aún no tienes mensajes</h3>
                            <p>Crea tu primer mensaje para generar su enlace y código QR.</p>
                            <button class="btn btn-primary" id="btn-agregar-empty">
                                <i class="fa-solid fa-plus"></i> Crear mensaje
                            </button>
                        </div>
                    </div>

                    <div class="gm-table-footer">
                        <div class="gm-entries">
                            <label for="entries-per-page">Mostrar</label>
                            <select id="entries-per-page" class="form-select form-select-sm">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                        <nav aria-label="Navegación de mensajes">
                            <ul class="pagination mb-0" id="pagination-controls"></ul>
                        </nav>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
